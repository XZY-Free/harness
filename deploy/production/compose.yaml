name: snow-harness

x-shared-environment: &shared-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  SNOW_WORKSPACES_DIR: ${SNOW_HARNESS_WORKSPACE_ROOT:?SNOW_HARNESS_WORKSPACE_ROOT is required}
  SNOWHARNESS_WORKSPACE_HOST_URL: http://workspace-host:8123
  SNOWHARNESS_SNAPSHOT_STORAGE_ROOT: ${SNOW_HARNESS_SNAPSHOT_ROOT:?SNOW_HARNESS_SNAPSHOT_ROOT is required}
  SNOWHARNESS_ENVIRONMENT_CONTROL_ROOT: ${SNOW_HARNESS_ENVIRONMENT_CONTROL_ROOT:?SNOW_HARNESS_ENVIRONMENT_CONTROL_ROOT is required}

x-shared-runtime: &shared-runtime
  restart: unless-stopped
  env_file:
    - path: .env.production
      required: true
  environment:
    <<: *shared-environment
  volumes:
    # 容器内外保持同一路径，受管容器的 Docker bind mount 才指向真实 Workspace。
    - ${SNOW_HARNESS_WORKSPACE_ROOT:?SNOW_HARNESS_WORKSPACE_ROOT is required}:${SNOW_HARNESS_WORKSPACE_ROOT:?SNOW_HARNESS_WORKSPACE_ROOT is required}
    - ${SNOW_HARNESS_SNAPSHOT_ROOT:?SNOW_HARNESS_SNAPSHOT_ROOT is required}:${SNOW_HARNESS_SNAPSHOT_ROOT:?SNOW_HARNESS_SNAPSHOT_ROOT is required}
    - ${SNOW_HARNESS_ENVIRONMENT_CONTROL_ROOT:?SNOW_HARNESS_ENVIRONMENT_CONTROL_ROOT is required}:${SNOW_HARNESS_ENVIRONMENT_CONTROL_ROOT:?SNOW_HARNESS_ENVIRONMENT_CONTROL_ROOT is required}
    - /var/run/docker.sock:/var/run/docker.sock

x-worker: &worker
  <<: *shared-runtime
  build:
    context: ../..
    dockerfile: docker/worker/Dockerfile
  image: snow-harness-worker:${SNOW_HARNESS_IMAGE_TAG:-latest}
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s

services:
  workspace-host:
    <<: *worker
    command: ["node_modules/.bin/tsx", "scripts/workers/workspace-host.ts"]
    environment:
      <<: *shared-environment
      SNOWHARNESS_WORKSPACE_HOST_ROOT: ${SNOW_HARNESS_WORKSPACE_ROOT:?SNOW_HARNESS_WORKSPACE_ROOT is required}
      SNOWHARNESS_WORKSPACE_HOST_BIND: 0.0.0.0
      SNOWHARNESS_WORKSPACE_HOST_PORT: 8123
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8123/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1

  web-api:
    <<: *shared-runtime
    build:
      context: ../..
      dockerfile: Dockerfile
    image: snow-harness-web:${SNOW_HARNESS_IMAGE_TAG:-latest}
    command: ["node_modules/.bin/next", "start", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - "${SNOW_HARNESS_HTTP_PORT:-3000}:3000"
    depends_on:
      workspace-host:
        condition: service_healthy
    deploy:
      replicas: 1

  hosted-provisioning-worker:
    <<: *worker
    environment:
      <<: *shared-environment
      WORKER_ROLE: hosted-provisioning-worker
    deploy:
      replicas: 1

  control-plane-outbox-worker:
    <<: *worker
    environment:
      <<: *shared-environment
      WORKER_ROLE: control-plane-outbox-worker
    deploy:
      replicas: 1

  runtime-dispatch-retry-worker:
    <<: *worker
    environment:
      <<: *shared-environment
      WORKER_ROLE: runtime-dispatch-retry-worker
    deploy:
      replicas: 1

  job-worker:
    <<: *worker
    environment:
      <<: *shared-environment
      WORKER_ROLE: job-worker
    deploy:
      replicas: 1

  tool-execution-worker:
    <<: *worker
    environment:
      <<: *shared-environment
      WORKER_ROLE: tool-execution-worker
    deploy:
      replicas: 1

  environment-lease-cleanup:
    <<: *worker
    command: ["node_modules/.bin/tsx", "scripts/workers/environment-lease-cleanup.ts"]
    healthcheck:
      disable: true
    deploy:
      replicas: 1
