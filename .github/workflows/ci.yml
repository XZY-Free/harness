name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: snow_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/snow_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contract verification
        run: pnpm contracts:verify

      - name: Dependency architecture
        run: pnpm architecture:check

      - name: Architecture gate
        run: pnpm architecture:gate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Empty MySQL migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/snow_test

      - name: Seed
        run: pnpm db:seed

      - name: Unit and MySQL integration tests
        run: pnpm test

      - name: Control-plane and Hosted E2E
        run: pnpm vitest run lib/control-plane/end-to-end-acceptance.test.ts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Web Playwright E2E
        run: pnpm test:e2e

      - name: Desktop build
        run: pnpm build:desktop

      - name: Desktop smoke
        run: pnpm vitest run --project unit desktop/main/local-renderer-server.test.ts desktop/renderer/desktop-route.test.ts desktop/renderer/src/desktop-renderer-app.test.tsx

      - name: Production Web build
        run: pnpm build:prod

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security check
        run: pnpm security:check
