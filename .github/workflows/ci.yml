name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # workspace-lock 原生 provider：宿主（开发机 / 运行镜像 / CI）先构建，与 Dockerfile 保持一致。
      - name: Build workspace-lock native provider
        run: pnpm build:workspace-lock
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
