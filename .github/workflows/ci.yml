name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 高位 host 端口，避开共享 runner 上默认 3306 可能的占用。
      DATABASE_URL: mysql://test:test@127.0.0.1:13306/snow_test

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为准（pnpm@10.32.1），
      # 不在此重复指定 version，避免 ERR_PNPM_BAD_PM_VERSION 冲突。
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # MySQL 用 step 内 docker run 启动而非 service：迁移含 CREATE TRIGGER，
      # 在 binlog 开启时需要 log_bin_trust_function_creators=1（否则
      # ER_BINLOG_CREATE_ROUTINE_NEED_SUPER, errno 1419）。该参数是 mysqld 参数，
      # 不是 docker create flag——GitHub service 的 options（docker flag）与
      # command（service 不支持该字段）都无法传递，因此改为 docker run。
      - name: Start MySQL container
        run: |
          docker run -d --name mysql --rm \
            -p 13306:3306 \
            -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=snow_test \
            -e MYSQL_USER=test -e MYSQL_PASSWORD=test \
            mysql:8.0 --log-bin-trust-function-creators=1
          for i in $(seq 1 60); do
            if docker exec mysql mysqladmin ping -h 127.0.0.1 -utest -ptest >/dev/null 2>&1; then
              echo "MySQL ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 未在超时内就绪" >&2
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: Contract verification
        run: pnpm contracts:verify

      - name: Dependency architecture
        run: pnpm architecture:check

      - name: Architecture gate
        run: pnpm architecture:gate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Empty MySQL migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:13306/snow_test

      - name: Seed
        run: pnpm db:seed

      # lib/qa/probes.browser.test.ts 需要 Playwright Chromium（pnpm test 会跑它），
      # 因此必须在 pnpm test 之前安装，否则 CI 干净环境报
      # browserType.launch: Executable doesn't exist。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Electron 二进制下载：pnpm 10.32 在真 workspace 下对 electron 的 build script
      # 判定失效——allowlist(onlyBuiltDependencies)/pnpm rebuild/dangerouslyAllowAllBuilds
      # 均不生效（esbuild 因 pnpm 内置放行仍运行），导致 electron 的 dist/electron 未下载，
      # ipc-handlers.test.ts 报 "Electron failed to install correctly"。直接运行 electron 的
      # install.js（@electron/get）显式下载二进制，绕开 pnpm 判定。
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Electron E2E 需要 X server（Desktop / Cross-client 用例真启动 Electron）。
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Unit and MySQL integration tests
        run: pnpm test

      - name: Control-plane and Hosted E2E
        run: pnpm vitest run lib/control-plane/end-to-end-acceptance.test.ts

      # Desktop E2E 依赖打包产物与为 Electron ABI 重建的 better-sqlite3。
      - name: Desktop build
        run: pnpm build:desktop

      - name: Desktop native rebuild
        run: pnpm rebuild:desktop-native

      # §20.4：Web 正式执行链（Thread → Turn → Invocation → Binding → Event → 回复）。
      # 契约：CI 门禁要求以 pnpm test:e2e 声明，避免裸 playwright 命令与脚本语义漂移。
      - name: Web Playwright E2E
        run: >-
          xvfb-run -a pnpm test:e2e
          e2e/smoke.spec.ts e2e/admin-conformance.spec.ts e2e/web-execution-chain.spec.ts

      # §20.4b：Desktop 本地渲染进程冒烟（纯本地 HTTP，无 DB/外部服务）。
      # 契约：CI 门禁要求显式声明 Desktop smoke 检查。
      - name: Desktop smoke
        run: pnpm vitest run desktop/main/local-renderer-server.test.ts

      # Electron 二进制依赖：`playwright install --with-deps chromium` 装的是 Chromium 的
      # 系统图形库，未完全覆盖 Electron 所需。CI Linux 上 Electron 启动会因缺共享库失败
      # （本地 mac 同 spec 通过，故为 CI 环境缺库）。先补装 Electron 官方依赖清单，再用
      # ldd 诊断确认无 "not found"。
      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
            libcairo2 libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 \
            libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 \
            libxrandr2 libxss1 libxtst6 libsecret-1-0 xdg-utils
      - name: Diagnose Electron shared libraries
        run: |
          ldd node_modules/electron/dist/electron | grep -i "not found" \
            || echo "OK: Electron 全部共享库已满足"

      # §20.5：真启动 Electron，验证 Desktop 走同一 Conversation API 与正式 Binding。
      - name: Desktop E2E
        run: xvfb-run -a pnpm exec playwright test e2e/desktop-execution-chain.spec.ts

      # §20.6：Web 与 Desktop 共用同一 Thread 与同一套控制面事实。
      - name: Cross-client E2E
        run: xvfb-run -a pnpm exec playwright test e2e/cross-client.spec.ts

      - name: Production Web build
        run: pnpm build:prod

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security check
        run: pnpm security:check
