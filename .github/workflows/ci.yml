name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  topic-01-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser and Desktop runtime dependencies
        run: |
          pnpm exec playwright install --with-deps chromium
          node node_modules/electron/install.js
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11
      - name: Run the shared verification plan
        run: pnpm topic01:acceptance
