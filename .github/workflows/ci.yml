name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        # 传给 mysql 容器的启动命令参数（附加到 entrypoint 后转发给 mysqld）。
        # 不能用 options（那是 docker create 的 flag，--log-bin-trust-function-creators
        # 不是 docker 合法 flag，会导致 exit 125 unknown flag）。
        # log_bin_trust_function_creators=1：drizzle 迁移中的存储函数无需 SUPER 即可创建。
        command: ["--log-bin-trust-function-creators=1"]
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: snow_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/snow_test

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为准（pnpm@10.32.1），
      # 不在此重复指定 version，避免 ERR_PNPM_BAD_PM_VERSION 冲突。
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contract verification
        run: pnpm contracts:verify

      - name: Dependency architecture
        run: pnpm architecture:check

      - name: Architecture gate
        run: pnpm architecture:gate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Empty MySQL migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/snow_test

      - name: Seed
        run: pnpm db:seed

      - name: Unit and MySQL integration tests
        run: pnpm test

      - name: Control-plane and Hosted E2E
        run: pnpm vitest run lib/control-plane/end-to-end-acceptance.test.ts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Electron E2E 需要 X server（Desktop / Cross-client 用例真启动 Electron）。
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Desktop E2E 依赖打包产物与为 Electron ABI 重建的 better-sqlite3。
      - name: Desktop build
        run: pnpm build:desktop

      - name: Desktop native rebuild
        run: pnpm rebuild:desktop-native

      # §20.4：Web 正式执行链（Thread → Turn → Invocation → Binding → Event → 回复）。
      # 契约：CI 门禁要求以 pnpm test:e2e 声明，避免裸 playwright 命令与脚本语义漂移。
      - name: Web Playwright E2E
        run: >-
          xvfb-run -a pnpm test:e2e
          e2e/smoke.spec.ts e2e/admin-conformance.spec.ts e2e/web-execution-chain.spec.ts

      # §20.4b：Desktop 本地渲染进程冒烟（纯本地 HTTP，无 DB/外部服务）。
      # 契约：CI 门禁要求显式声明 Desktop smoke 检查。
      - name: Desktop smoke
        run: pnpm vitest run desktop/main/local-renderer-server.test.ts

      # §20.5：真启动 Electron，验证 Desktop 走同一 Conversation API 与正式 Binding。
      - name: Desktop E2E
        run: xvfb-run -a pnpm exec playwright test e2e/desktop-execution-chain.spec.ts

      # §20.6：Web 与 Desktop 共用同一 Thread 与同一套控制面事实。
      - name: Cross-client E2E
        run: xvfb-run -a pnpm exec playwright test e2e/cross-client.spec.ts

      - name: Production Web build
        run: pnpm build:prod

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security check
        run: pnpm security:check
