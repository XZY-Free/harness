name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # workspace-lock 原生 provider：宿主（开发机 / 运行镜像 / CI）必须先构建
      # （与 Dockerfile、docker/worker/Dockerfile 一致）；vitest 工作区用例自阶段 3 起依赖它。
      - name: Build workspace-lock native provider
        run: pnpm build:workspace-lock
      - name: Install browser and Desktop runtime dependencies
        run: |
          pnpm exec playwright install --with-deps chromium
          node node_modules/electron/install.js
          sudo apt-get update
          # attr/acl 提供 getfattr/getfacl：Snapshot 元数据核查（xattr/ACL 探测）的 Linux 前置，
          # 与 Dockerfile 生产镜像的供应保持一致。
          sudo apt-get install -y ripgrep xvfb gnome-keyring dbus-x11 attr acl
      - name: Run the shared verification plan
        run: pnpm acceptance
        env:
          ACCEPTANCE_REMOTE_HEAD_SHA: ${{ github.sha }}
          ACCEPTANCE_GITHUB_CI: passed
