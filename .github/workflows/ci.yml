name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 高位 host 端口，避开共享 runner 上默认 3306 可能的占用。
      DATABASE_URL: mysql://test:test@127.0.0.1:13306/snow_test

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为准（pnpm@10.32.1），
      # 不在此重复指定 version，避免 ERR_PNPM_BAD_PM_VERSION 冲突。
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # MySQL 用 step 内 docker run 启动而非 service：迁移含 CREATE TRIGGER，
      # 在 binlog 开启时需要 log_bin_trust_function_creators=1（否则
      # ER_BINLOG_CREATE_ROUTINE_NEED_SUPER, errno 1419）。该参数是 mysqld 参数，
      # 不是 docker create flag——GitHub service 的 options（docker flag）与
      # command（service 不支持该字段）都无法传递，因此改为 docker run。
      - name: Start MySQL container
        run: |
          docker run -d --name mysql --rm \
            -p 13306:3306 \
            -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=snow_test \
            -e MYSQL_USER=test -e MYSQL_PASSWORD=test \
            mysql:8.0 --log-bin-trust-function-creators=1
          for i in $(seq 1 60); do
            if docker exec mysql mysqladmin ping -h 127.0.0.1 -utest -ptest >/dev/null 2>&1; then
              echo "MySQL ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 未在超时内就绪" >&2
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: Contract verification
        run: pnpm contracts:verify

      - name: Dependency architecture
        run: pnpm architecture:check

      - name: Architecture gate
        run: pnpm architecture:gate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Empty MySQL migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:13306/snow_test

      - name: Seed
        run: pnpm db:seed

      # lib/qa/probes.browser.test.ts 需要 Playwright Chromium（pnpm test 会跑它），
      # 因此必须在 pnpm test 之前安装，否则 CI 干净环境报
      # browserType.launch: Executable doesn't exist。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Electron 二进制下载：pnpm 10.32 在真 workspace 下对 electron 的 build script
      # 判定失效——allowlist(onlyBuiltDependencies)/pnpm rebuild/dangerouslyAllowAllBuilds
      # 均不生效（esbuild 因 pnpm 内置放行仍运行），导致 electron 的 dist/electron 未下载，
      # ipc-handlers.test.ts 报 "Electron failed to install correctly"。直接运行 electron 的
      # install.js（@electron/get）显式下载二进制，绕开 pnpm 判定。
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Web Playwright E2E 需要 X server（xvfb-run 包装 test:e2e）。
      # gnome-keyring + dbus-x11 随真启动 Electron 的用例迁至独立 desktop-e2e job——
      # 只有那类用例需要 DBus secret service（Electron safeStorage）。
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Unit and MySQL integration tests
        run: pnpm test

      - name: Control-plane and Hosted E2E
        run: pnpm vitest run lib/control-plane/end-to-end-acceptance.test.ts

      # §20.4：Web 正式执行链（Thread → Turn → Invocation → Binding → Event → 回复）。
      # 契约：CI 门禁要求以 pnpm test:e2e 声明，避免裸 playwright 命令与脚本语义漂移。
      - name: Web Playwright E2E
        run: >-
          xvfb-run -a pnpm test:e2e
          e2e/smoke.spec.ts e2e/admin-conformance.spec.ts e2e/web-execution-chain.spec.ts

      # §20.4b：Desktop 本地渲染进程冒烟（纯本地 HTTP，无 DB/外部服务）。
      # 契约：CI 门禁要求显式声明 Desktop smoke 检查。
      - name: Desktop smoke
        run: pnpm vitest run desktop/main/local-renderer-server.test.ts

      # §20.5 Desktop E2E / §20.6 Cross-client E2E 已从巨型串行 verify 拆出，
      # 迁至独立 desktop-e2e job——真启动 Electron 的用例（含其 Xvfb/gnome-keyring/
      # Electron 二进制诊断与 safeStorage 冒烟）只等那个 job 快速反馈。

      - name: Production Web build
        run: pnpm build:prod

  # §20.5/§20.6 Desktop E2E 独立 job：真启动 Electron 验证 Desktop 走同一 Conversation
  # API 与正式 Binding，以及 Web 与 Desktop 共用同一 Thread。从巨型串行 verify 中拆出，
  # 使 Desktop 相关改动只等本 job 快速反馈，不必重跑 verify 的整套契约/单测/Web 门禁。
  # 仍是完整 CI 的一部分——verify + desktop-e2e + security 全绿才通过门禁，不降低验收。
  desktop-e2e:
    runs-on: ubuntu-latest
    env:
      # E2E 的 webServer（scripts/e2e-start.mts）自用 testcontainers 起 MySQL，
      # 不依赖 verify job 的 13306 容器。此 env 与 verify 保持一致，行为无漂移。
      DATABASE_URL: mysql://test:test@127.0.0.1:13306/snow_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_manager: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Electron 二进制：pnpm 10.32 真 workspace 下判定失效，install.js 兜底下载。
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Playwright Chromium：cross-client 的 Web 侧用真实浏览器；保守安装保证可用。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Electron E2E 需要 X server 与 DBus secret service（safeStorage）。
      - name: Install Xvfb and gnome-keyring
        run: sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11

      # Electron 二进制可执行性冒烟（正式 E2E 前的快速失败信号）。
      - name: Diagnose Electron binary
        run: |
          ldd node_modules/electron/dist/electron | grep "not found" || echo "LDD-OK: Electron 共享库已满足"
          timeout 15 xvfb-run -a node_modules/electron/dist/electron --no-sandbox --version

      # 真实 safeStorage 冒烟：断言 isEncryptionAvailable()，非零退出即失败。
      # 这是 Desktop E2E 历史上 firstWindow closed 的根因闸门——替换被弃用的
      # set +e main-process smoke（那不能作为启动成功证据）。修复方向：不传
      # --password-store=basic，让 gnome-keyring 提供 secret service（gnome_libsecret）。
      # 必须加 --no-sandbox：CI 容器内 Chromium 沙箱不可用，否则 Electron 在
      # app.whenReady 前崩溃（exit 133），跑不到 safeStorage 检查。
      - name: Electron safeStorage smoke
        run: >-
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --replace --components=secrets >/dev/null 2>&1 &
            sleep 2
            xvfb-run -a node_modules/electron/dist/electron --no-sandbox e2e/support/electron-safe-storage-smoke.js
          '

      # Desktop E2E 依赖打包产物与为 Electron ABI 重建的 better-sqlite3。
      - name: Desktop build
        run: pnpm build:desktop

      - name: Desktop native rebuild
        run: pnpm rebuild:desktop-native

      # §20.5：真启动 Electron，验证 Desktop 走同一 Conversation API 与正式 Binding。
      # 在 gnome-keyring secret service 下运行，使 Electron safeStorage 可用。
      - name: Desktop E2E
        run: >-
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --replace --components=secrets >/dev/null 2>&1 &
            sleep 2
            xvfb-run -a pnpm exec playwright test e2e/desktop-execution-chain.spec.ts
          '

      # §20.6：Web 与 Desktop 共用同一 Thread 与同一套控制面事实。
      - name: Cross-client E2E
        run: >-
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --replace --components=secrets >/dev/null 2>&1 &
            sleep 2
            xvfb-run -a pnpm exec playwright test e2e/cross-client.spec.ts
          '

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_manager: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security check
        run: pnpm security:check
